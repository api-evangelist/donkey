name: Donkey
description: Donkey is an AI-native trading company (Y Combinator, Summer 2026) that
  buys directly from Chinese factories and sells delivered duty-paid to US importers.
  Donkey mines public US customs records to identify the factory that actually makes
  a product, returns a landed DDP quote within 72 hours, runs its own on-the-floor
  quality inspections before the factory is paid, clears customs, moves the money,
  and offers credit-insured net-45 terms to qualified buyers. Founded by Benjamin
  Martindale (CEO) and Minghao Tan (CTO), the company runs small teams in San Francisco
  and China. Donkey publishes no public API, SDK, or developer platform today; this
  profile tracks its company identity in the API Evangelist network.
